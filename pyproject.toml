[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmap-parser"
version = "1.0.0"
description = "Convert Nmap XML scan results to Excel format with GUI and CLI support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "test233"}
]
keywords = ["nmap", "xml", "excel", "xlsx", "security", "scan", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: GTK",
    "Environment :: MacOS X",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "xlsxwriter>=3.0.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2.0"]

[project.scripts]
nmap-parser = "nmap_parser.cli:main"
nmap-parser-gui = "nmap_parser.gui:main"

[project.gui-scripts]
nmap-parser-gui = "nmap_parser.gui:main"

[project.urls]
Homepage = "https://github.com/bright-angel/nmap-parser"
Repository = "https://github.com/bright-angel/nmap-parser.git"
Issues = "https://github.com/bright-angel/nmap-parser/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nmap_parser*"]
