name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ruff mypy build

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke test installed CLI
        run: |
          python -m pip install dist/*.whl --force-reinstall --no-deps
          nmap-parser --version
        shell: bash

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        with:
          name: distributions
          path: dist/*
